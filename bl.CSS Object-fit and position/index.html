<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Object-fit and position</title>
    <style>
        .container{
            width: 600px;
            height: 600px;
            border: 2px solid black;
            background-color: aquamarine;
        }
        img{
            width: 466px;
            height: 488px;
             border: 2px solid rgb(244, 21, 21);
             object-fit: contain;
             /* object-fit: fill; */
             /* object-fit: cover; */
             /* object-position: top right; */
             object-position: 10px 20px;
            }
    </style>
</head>
<body>
    <div class="container">
        <img src="image.jpeg" alt="flower">
    </div>
</body>
</html>
