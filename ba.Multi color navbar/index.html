<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mul color navbar</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        :root {
            --primary-color: rgb(56, 38, 248);
            --text-color:white;
            --secondary-color:rgb(131, 120, 253);
        }
        /* :root {
            --primary-color: rgb(9, 243, 9);
            --text-color:white;
            --secondary-color:rgb(146, 253, 146);
        } */
        body{
            background-color: var(--secondary-color);
        }
        nav {
            padding: 12px 0px;
            background-color: var(--primary-color);
        }

        ul li{
            display: inline;
            list-style: none;
            padding: 23px;
        }
        ul li a{
            color: var(--text-color);
            text-decoration: none;
            font-size: 22px;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/">About</a></li>
                <li><a href="/">Service</a></li>
                <li><a href="/">Contact</a></li>
            </ul>
        </nav>
    </header>
</body>

</html>
