<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar using Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <img src="logo.svg" alt="Logo">
            </div>
            <div class="right">
                <ul>
                    <li>Products</li>
                    <li>Buy</li>
                    <li>Renew</li>
                    <li>Support</li>
                    <li>Learn</li>
                    <li>Company</li>
                </ul>
            </div>
            <div class="left">
                <button>Download</button>
                <button>English</button>
                <button>search</button>
            </div>
        </nav>
    </header>
    <main>
        <section class="first">
            <span>Download <b>UltraEdit</b> for Windows</span>
            <p> Download and try UltraEdit before you buy it! This download includes the full Windows version of the Ultra Edits</p>
            <div>
                <button class="btn">
                    Download for Windows Mac or Linux
                </button>
            </div>
        </section>
        <section class="second">
            <div class="flex">
                <span class="big">Download UltraEdits </span>
                <span class="small">            latest version</span>
            </div>
            <div class="grid">
                <div class="item">
                    <div class="item-lang">English

                    </div>
                    <button class="btn blue">Download 32 bit</button>
                    <button class="btn green">Download 62 bit</button>
                </div>
                <div class="item">
                    <div class="item-lang">English

                    </div>
                    <button class="btn blue">Download 32 bit</button>
                    <button class="btn green">Download 62 bit</button>
                </div>
                <div class="item">
                    <div class="item-lang">English

                    </div>
                    <button class="btn blue">Download 32 bit</button>
                    <button class="btn green">Download 62 bit</button>
                </div>
                <div class="item">
                    <div class="item-lang">English

                    </div>
                    <button class="btn blue">Download 32 bit</button>
                    <button class="btn green">Download 62 bit</button>
                </div>
                <div class="item">
                    <div class="item-lang">English

                    </div>
                    <button class="btn blue">Download 32 bit</button>
                    <button class="btn green">Download 62 bit</button>
                </div>
                <div class="item">
                    <div class="item-lang">English

                    </div>
                    <button class="btn blue">Download 32 bit</button>
                    <button class="btn green">Download 62 bit</button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
