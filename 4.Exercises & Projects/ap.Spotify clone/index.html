<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
</head>

<body>
    <div class="container flex bg-black">
        <div class="left">
            <div class="home bg-gray rounded m5 p10">
                <div class="logo">
                    <img class="invert" src="assets/logo.svg" alt="logo">
                </div>
                <ul>
                    <li><img class="invert" src="assets/home.svg" alt="home">Home</li>
                    <li><img class="invert" src="assets/search.svg" alt="search">Search</li>
                </ul>
            </div>
            <div class="library bg-gray rounded m5 p10">
                <div class="heading">
                    <img class="invert" src="assets/playlist.svg" alt="playlist">
                    <h2 style="white-space: nowrap;">Your Library</h2>
                </div>
                <div class="footer">
                    <div class="footer">
                        <div><a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a></div>
                        <div><a href="https://www.spotify.com/jp/privacy/"><span>Privacy Center</span></a></div>
                        <div><a href="https://www.spotify.com/jp/legal/privacy-policy/"><span>Privacy Policy</span></a>
                        </div>
                        <div><a href="https://www.spotify.com/jp/legal/cookies-policy/"><span>Cookies</span></a></div>
                        <div><a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"><span>About Ads</span></a>
                        </div>
                        <div><a href="https://www.spotify.com/jp/accessibility/"><span>Accessibility</span></a></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="right">
            <div class="header bg-gray rounded m5 p10">
                <div class="nav">
                    <img class="invert" src="assets/leftArrow.png" alt="icon">
                    <img class="invert" src="assets/rightArrow.png" alt="icon">
                </div>
                <div class="buttons">
                    <button>Sign-up</button>
                    <button>Login</button>
                </div>
            </div>
            <div class="Spotify-playlist bg-gray rounded m5 p10">
                <h1>Spotify Playlist</h1>
                <div class="cardcontainer">
                    <div class="card">
                        <img src="songs/s1.png" alt="image">
                        <h3>Hip Hop</h3>
                        <p>Welcome to let's play songs lets do it together with</p>
                    </div>
                    <div class="card">
                        <img src="songs/s1.png" alt="image">
                        <h3>Hip Hop</h3>
                        <p>Welcome to let's play songs lets do it together with</p>
                    </div>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </div>
</body>

</html>
