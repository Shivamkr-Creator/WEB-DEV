<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS filters</title>
    <style>
        /* img{
            filter: blur(10px);
        } */
        .img1 {
            filter: brightness(100px);
        }

        .img2 {
            filter: opacity(0.5) contrast(10px);
        }

        .img3 {
            filter: invert(10);
        }
    </style>
</head>

<body>
    <div class="container">
        <img class="img1" src="image1.jpeg" alt="flower">
        <img class="img2" src="image2.png" alt="">
        <img class="img3" src="image3.png" alt="">
    </div>
</body>

</html>
