<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Design</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            background-color: black;
        }
        header{
             position: sticky;
             top: 0;
        }
        nav {
            background-color: pink;
            height: 83px;
           
        }

        .container {
            background-color: green;
            margin: 40px 34px;
            padding: 55px 23px;
            text-align: center;
        }

        .box1 {
            background-color: orange;
            display: inline-block;
            width: 45%;
            height: 70vh;
            margin: 0px 50px;
        }

        .box2 {
            background-color: blue;
            display: inline-block;
            width: 45%;
            height: 70vh;
            margin: 0px 50px;
        }

        .textbox {
            padding: 34px;
            margin: 0px 34vw;
            border: 5px solid white;
            color: white;
            text-align: center;
            font-size: 30px;
        }

        footer {
            height: 100px;
        }
    </style>
</head>

<body>
    <header>
        <nav>

        </nav>
    </header>
    <main>
        <div class="container">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>
    </main>
    <footer>
        <div class="textbox">
            <p>Hey i am Shivam</p>
        </div>
    </footer>
</body>

</html>
