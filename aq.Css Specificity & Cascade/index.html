<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Specificity & Cascade</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div>
        <!-- Universal selector (lowest specificity)-->
        <h1>css specificity</h1>
        <!-- Element selector (2nd lowest specificity)-->
        <h1>css specificity</h1>
        <!--Class & Attribute selector (3rd lowest specificity)-->
        <h1 class="yellow cred cpurple" data-x="a">css specificity</h1>
        <!-- Id selector (2nd highest specificity)-->
        <h1 id="h1">css specificity</h1>
        <!-- Inline style (highest specificity) -->
        <!-- /* The specificity of this selector is 1000 */ -->
        <h1 style="color: blue;" class="yellow cred cpurple">css specificity</h1>
        <!-- use of important to bypass inline style-->
         <!-- /* The specificity of this selector is 10000 */ -->
        <h1 style="color: blue;" class="yellow cred cpurple imp">css specificity</h1>
    </div>
</body>

</html>
